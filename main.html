<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Fridge | 냉장고 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html">MY FRIDGE</a>
      <a class="header-link" href="index.html">냉장고 닫기</a>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-heading">
      <h1>냉장고 관리하기</h1>
      <p class="muted">냉장고 속 식품을 한 눈에 관리하세요.</p>
    </div>
    <section class="panel" aria-labelledby="summary-title">
      <h2 id="summary-title">냉장고 현황</h2>
      <div class="summary-grid">
        <button class="summary-box" type="button" disabled><strong id="total-count">0</strong><span>전체 식품</span></button>
        <button class="summary-box" type="button" disabled><strong id="soon-count">0</strong><span>소비기한 임박</span></button>
        <button class="summary-box" type="button" disabled><strong id="expired-count">0</strong><span>소비기한 경과</span></button>
      </div>
    </section>
    <section class="panel" aria-labelledby="register-title">
      <h2 id="register-title">식품 등록</h2>
      <form id="food-form">
        <div class="form-grid">
          <div class="field"><label for="food-name">식품명</label><input id="food-name" name="foodName" type="text" placeholder="예: 우유" required></div>
          <div class="field"><label for="food-quantity">수량</label><input id="food-quantity" name="quantity" type="number" min="1" value="1" required></div>
          <div class="field"><label for="food-expiry">소비기한</label><input id="food-expiry" name="expiryDate" type="date" required></div>
        </div>
        <button id="food-submit" class="primary-button form-button" type="submit" disabled>식품 등록</button>
      </form>
    </section>
    <section class="panel" aria-labelledby="list-title">
      <div class="section-heading">
        <h2 id="list-title">식품 목록</h2>
        <select id="sort-select">
          <option value="expiry-asc">소비기한 임박 순</option>
          <option value="name-asc">식품이름 순</option>
          <option value="recent">최근 등록 순</option>
        </select>
      </div>
      <div id="food-list" class="empty-state">
        <p>아직 등록된 식품이 없습니다.</p>
      </div>
    </section>
    <section class="panel" aria-labelledby="shopping-title">
      <div class="section-heading">
        <h2 id="shopping-title">장보기 목록</h2>
        <span id="shoppig-count" class="muted">0개</span>
      </div>
      <p class="section-help">필요한 식품을 등록하고, 구매했다면 체크해보세요.</p>
      <form id="shopping-form" class="shopping-form">
        <div class="field">
          <label for="shopping-name">구매할 품목</label>
          <input id="shopping-name" type="text" maxlength="60" placeholder="예: 우유" required>
        </div>
        <button class="primary-button" type="submit">장보기 추가</button>
      </form>
      <div id="shopping-list" aria-live="polite" class="empty-state">장보기 목록이 비어있습니다</div>
    </section>
  </main>
  <footer class="site-footer">My Fridge · 웹프로그래밍 프로젝트</footer>
</body>
</html>
